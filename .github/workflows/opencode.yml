name: opencode

# Deux façons de lancer OpenCode (via OpenRouter) sans votre PC :
#  1. Commenter "/oc <demande>" ou "/opencode <demande>" sur une issue ou une PR
#     (nécessite l'app GitHub https://github.com/apps/opencode-agent installée sur le dépôt).
#  2. Onglet Actions → "opencode" → "Run workflow" avec une tâche : OpenCode reprend
#     .ai/HANDOFF.md, travaille et pousse ses commits sur la branche choisie.
# Secret requis : OPENROUTER_API_KEY (Settings → Secrets and variables → Actions).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task:
        description: "Tâche (vide = reprendre .ai/HANDOFF.md)"
        required: false
        default: ""
      model:
        description: "Modèle OpenRouter (provider/model)"
        required: false
        default: "openrouter/anthropic/claude-sonnet-4.5"

jobs:
  opencode-comment:
    if: |
      github.event_name != 'workflow_dispatch' && (
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/anthropic/claude-sonnet-4.5

  opencode-task:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer OpenCode
        run: npm install -g opencode-ai
      - name: Configurer git
        run: |
          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"
      - name: "Travailler jusqu'à STATUS: DONE"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_MODEL: ${{ inputs.model }}
          AI_MAX_ROUNDS: "10"
          TASK: ${{ inputs.task }}
        run: scripts/ai-dev.sh --mode opencode "$TASK"
      - name: Pousser le travail
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "opencode: travail automatique"
          git push origin HEAD:${{ github.ref_name }}
